name: DCO
on:
  pull_request:
    branches: [main]
jobs:
  dco:
    name: DCO Sign-off Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all commits for Signed-off-by
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          MISSING=0
          for sha in $(git log --no-merges --format="%H" "origin/$BASE_REF..HEAD"); do
            body=$(git log -1 --format="%B" "$sha")
            if ! echo "$body" | grep -qE "^Signed-off-by: .+ <.+@.+>"; then
              echo "::error::Missing Signed-off-by in commit $(git log -1 --format='%h %s' $sha)"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "Use 'git commit -s' or add 'Signed-off-by: Name <email>' manually."
            exit 1
          fi
          echo "All commits have Signed-off-by."
