name: QC Preflight Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Run QC Preflight Checks
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@v2
    with:
      enable-semgrep-scan: true
      enable-dependency-review: true
      enable-repolinter-check: false   # disabled — see repolinter job below
      enable-copyright-license-check: true
      enable-commit-email-check: true
      enable-commit-msg-check: false
      enable-armor-checkers: false
    permissions:
      contents: read
      security-events: write

  repolinter:
    name: Repolinter Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: todogroup/repolinter-action@v1
        with:
          config_file: repolint.json
          output_type: exit-code
          output_name: "[Repolinter] Open Source Policy Issues"
          label_name: repolinter
          label_color: fbca04
